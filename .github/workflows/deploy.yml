name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master # Deploy automatically upon push to main or master

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build SPA
        run: npm run build

      - name: Deploy static build to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs # Folder where built app resides after running npm run build
          branch: gh-pages # Target branch for your GitHub Pages deploy
